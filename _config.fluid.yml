# Fluid 主题配置文件
# 详细文档: https://hexo.fluid-dev.com/docs/guide/

# 全局配置
navbar:
  blog_title: "Boyu's Blog"
  ground_glass:
    enable: true
  menu:
    - { key: 'home', link: '/', icon: 'iconfont icon-home-fill', name: '首页' }
    - { key: 'tech', link: '/categories/tech/', icon: 'iconfont icon-code', name: '技术分享' }
    - { key: 'life', link: '/categories/life/', icon: 'iconfont icon-lifestyle', name: '生活日常' }
    - { key: 'reading', link: '/categories/reading/', icon: 'iconfont icon-books', name: '读书笔记' }
    - { key: 'about', link: '/about/', icon: 'iconfont icon-user-fill', name: '关于' }

# 首页 Banner
index:
  banner_img: /img/default.png
  banner_img_height: 100
  slogan:
    enable: true
    text: "技术分享 | 生活日常 | 读书笔记"

# 文章页配置
post:
  banner_img: /img/default.png
  banner_img_height: 70
  default_index_img: /img/default.png

# 分类页
category:
  banner_img: /img/default.png
  banner_img_height: 60

# 标签页
tag:
  banner_img: /img/default.png
  banner_img_height: 60

# 关于页
about:
  banner_img: /img/default.png
  banner_img_height: 60
  avatar: /img/avatar.png
  name: "Boyu"
  intro: "热爱技术，热爱生活"
  icons:
    - { class: 'iconfont icon-github-fill', link: 'https://github.com/fby6666', tip: 'GitHub' }

# 页脚
footer:
  content: '<p>&copy; {year} Boyu | Powered by <a href="https://hexo.io" target="_blank">Hexo</a> & <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank">Fluid</a></p>'

# 代码高亮
code:
  copy_btn: true
  highlight:
    enable: true
    theme: 'github-gist'
    theme_dark: 'atom-one-dark'

# 暗色模式
dark_mode:
  enable: true
  default: auto

# 评论系统 (使用 Gitalk，需要后续配置)
# comment:
#   enable: true
#   type: gitalk
#   gitalk:
#     clientID: ''
#     clientSecret: ''
#     repo: ''
#     owner: ''
#     admin: ['']

# 搜索功能
search:
  enable: true
  type: local
  content: true
  path: search.xml
  field: post
